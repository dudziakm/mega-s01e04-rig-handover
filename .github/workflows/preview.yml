# Plan morning-digest §3: run rig, save /digest/2026-10-28 as one HTML file and put it on this
# repo's GitHub Pages. The page leaves as a Pages artifact, never as a commit (ADR 0003).
name: preview

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  save:
    name: Save the digest page
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # No LANE_MARKER secret (the clean-up run) leaves the banner at "no marker set".
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          { grep -v '^LANE_MARKER=' .env.example; printf 'LANE_MARKER=%s\n' "$LANE_MARKER"; } > .env
          pnpm start > rig.log 2>&1 &
          rig=$!
          for _ in $(seq 30); do curl -fsS -o /dev/null http://localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -fsS http://localhost:8787/digest/2026-10-28 -o _site/index.html
          kill "$rig"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: save
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages artifact
      id-token: write # deploy-pages proves the run's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
